# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: publish

on:
  release:
    types: [published]
  workflow_call:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: publish-artifacts
  cancel-in-progress: false

jobs:
  publish:
    name: publish - ghcr image and helm chart
    if: >-
      github.repository == 'juftin/camply-web' &&
      (github.event_name == 'push' ||
       (github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: git - resolve publication source
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName === 'release') {
              const tag = context.payload.release.tag_name;
              if (!/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(tag)) {
                throw new Error('Publishing requires a stable vMAJOR.MINOR.PATCH release tag');
              }
              core.setOutput('ref', `refs/tags/${tag}`);
              core.setOutput('version', tag.slice(1));
            } else if (context.eventName === 'push' && context.ref === 'refs/heads/main') {
              core.setOutput('ref', context.sha);
              core.setOutput('version', '');
            } else {
              throw new Error('Latest publication requires a successful main push');
            }
      - name: checkout - exact publication source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.ref }}
          persist-credentials: false
      - name: backend - setup toolchain
        uses: ./.github/actions/setup-backend
      - name: frontend - setup toolchain
        uses: ./.github/actions/setup-frontend
      - name: release - stamp application version
        if: steps.source.outputs.version != ''
        run: task release:prepare
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
      - name: git - record source revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: docker - login to ghcr
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: docker - setup buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: docker - enable task build cache
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL);
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', process.env.ACTIONS_CACHE_SERVICE_V2);
      - name: docker - publish release image
        if: steps.source.outputs.version != ''
        run: task publish
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          GITHUB_SHA: ${{ steps.revision.outputs.sha }}
      - name: docker - publish latest image for main build
        if: steps.source.outputs.version == ''
        run: task publish:latest
        env:
          GITHUB_SHA: ${{ steps.revision.outputs.sha }}
      - name: helm - install helm and oras
        env:
          HELM_VERSION: v4.3.0
          ORAS_VERSION: 1.3.0
        run: |
          curl -fsSLo /tmp/helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/helm.tar.gz -C /tmp
          install /tmp/linux-amd64/helm "$HOME/.local/bin/helm"
          curl -fsSLo /tmp/oras.tar.gz "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/oras.tar.gz -C /tmp oras
          install /tmp/oras "$HOME/.local/bin/oras"
      # ORAS reuses the Docker registry credentials established above.
      - name: helm - publish matching chart tags
        run: task helm:publish
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          GITHUB_SHA: ${{ steps.revision.outputs.sha }}

  pypi:
    name: publish - camply-web python package
    if: >-
      github.repository == 'juftin/camply-web' &&
      github.event_name == 'release' &&
      !github.event.release.prerelease &&
      !github.event.release.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/camply-web
    steps:
      - name: git - resolve publication source
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName === 'release') {
              const tag = context.payload.release.tag_name;
              if (!/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(tag)) {
                throw new Error('Publishing requires a stable vMAJOR.MINOR.PATCH release tag');
              }
              core.setOutput('ref', `refs/tags/${tag}`);
              core.setOutput('version', tag.slice(1));
            } else {
              throw new Error('PyPI publication requires a release event');
            }
      - name: checkout - exact publication source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.ref }}
          persist-credentials: false
      - name: backend - setup toolchain
        uses: ./.github/actions/setup-backend
      - name: frontend - setup toolchain
        uses: ./.github/actions/setup-frontend
      - name: release - stamp application version
        run: task release:prepare
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
      - name: pypi - publish package to pypi
        run: task publish:python
