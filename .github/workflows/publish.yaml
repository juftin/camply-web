# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: publish

on:
  release:
    types: [published]
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  publish:
    name: Camply Web Image
    if: >-
      github.repository == 'juftin/camply-web' &&
      (github.event_name == 'push' ||
       (github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve publication source
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName === 'release') {
              const tag = context.payload.release.tag_name;
              if (!/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(tag)) {
                throw new Error('Publishing requires a stable vMAJOR.MINOR.PATCH release tag');
              }
              core.setOutput('ref', `refs/tags/${tag}`);
              core.setOutput('version', tag.slice(1));
            } else if (context.eventName === 'push' && context.ref === 'refs/heads/main') {
              core.setOutput('ref', context.sha);
              core.setOutput('version', '');
            } else {
              throw new Error('Latest publication requires a successful main push');
            }
      - name: Checkout the exact publication source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/setup-frontend
      - name: Stamp the released application version
        if: steps.source.outputs.version != ''
        run: task release:prepare
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
      - name: Record the checked-out source revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Enable Docker build cache access for Task
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL);
            core.exportVariable('ACTIONS_CACHE_SERVICE_V2', process.env.ACTIONS_CACHE_SERVICE_V2);
      - name: Publish release image
        if: steps.source.outputs.version != ''
        run: task publish
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          GITHUB_SHA: ${{ steps.revision.outputs.sha }}
      - name: Publish latest for a main build without a release
        if: steps.source.outputs.version == ''
        run: task publish:latest
        env:
          GITHUB_SHA: ${{ steps.revision.outputs.sha }}
