name: Publish to PyPI

on:
  push:
    tags:
      - "camply-v*"
      - "camply-core-v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish ('camply' or 'camply-core')"
        required: true
        type: choice
        options:
          - camply
          - camply-core

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pypi-publish:
    name: Build & Publish
    if: github.repository_owner == 'juftin'
    runs-on: ubuntu-latest
    environment:
      name: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Build standalone wheel and sdist
        run: |
          cd backend
          TARGET="${{ inputs.package }}"
          if [ -z "$TARGET" ]; then
            if [[ "${{ github.ref_name }}" =~ ^camply-core-v ]]; then
              TARGET="camply-core"
            else
              TARGET="camply"
            fi
          fi
          echo "Building package: $TARGET"
          uv build --package "$TARGET" --no-sources --out-dir dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: backend/dist/
