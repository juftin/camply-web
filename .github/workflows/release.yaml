# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: release

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  release:
    name: GitHub Release
    needs: [ci]
    if: github.repository == 'juftin/camply-web'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      published: ${{ steps.result.outputs.published }}
    steps:
      - name: Checkout release source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/setup-frontend
      - name: Generate release token with the existing Renovate App
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          # Moving major tags across workflow changes requires this permission.
          permission-workflows: write
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Install npm compatible with the shared release lockfile
        # Match the shared action's Node installation so it retains npm 10.
        # npm 11 rejects the shared action's release lockfile.
        run: npm install --global npm@10.9.9
      - name: Semantic release
        uses: juftin/actions/semantic-release@5a54b64fe07d8de40f92676cae6b56c565ec28b2 # v1.4.0
        with:
          github_token: ${{ steps.app-token.outputs.token }}
      - name: Report whether a release was published
        id: result
        run: |
          if test -f .release-published; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  publish-main:
    name: Publish Main Without a Release
    needs: [release]
    if: needs.release.outputs.published == 'false'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yaml
