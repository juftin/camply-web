---
name: CI

permissions:
  contents: read
  actions: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────

  backend-checks:
    name: Backend ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            cmd: task backend:lint
          - name: Type Check
            cmd: task backend:check
          - name: Tests
            cmd: task backend:test
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: ./.github/actions/setup-backend
      - name: ${{ matrix.name }}
        run: ${{ matrix.cmd }}

  backend-docker:
    name: Backend Docker Build
    needs: [backend-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build backend image
        uses: docker/bake-action@6614cfa25eff9a0b2b2697efb0b6159e7680d584 # v7.2.0
        with:
          files: ./docker-compose.yaml
          targets: backend
          push: false
          set: |
            *.cache-from=type=gha,scope=backend
            *.cache-to=type=gha,mode=max,scope=backend
        env:
          BACKEND_VERSION: ci-${{ github.sha }}

  # ── Frontend ─────────────────────────────────────────────────────────────

  frontend-checks:
    name: Frontend ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            cmd: task frontend:lint
          - name: Type Check
            cmd: task frontend:check
          - name: Tests
            cmd: task frontend:test
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: ./.github/actions/setup-frontend
      - name: ${{ matrix.name }}
        run: ${{ matrix.cmd }}

  frontend-docker:
    name: Frontend Docker Build
    needs: [frontend-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build frontend image
        uses: docker/bake-action@6614cfa25eff9a0b2b2697efb0b6159e7680d584 # v7.2.0
        with:
          files: ./docker-compose.yaml
          targets: frontend
          push: false
          set: |
            *.cache-from=type=gha,scope=frontend
            *.cache-to=type=gha,mode=max,scope=frontend
            frontend.args.CAMPLY_API_URL=
        env:
          FRONTEND_VERSION: ci-${{ github.sha }}
