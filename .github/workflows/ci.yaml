# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: ci

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  backend:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend - format
            task: backend:fmt:check
            install: true
            annotations_ruff: true

          - name: backend - lint
            task: backend:lint
            install: true
            annotations_ruff: true

          - name: backend - type check
            task: backend:check
            install: true
            annotations_mypy: true

          - name: backend - test - 3.11
            task: backend:test
            install: true
            python: "3.11"

          - name: backend - test - 3.12
            task: backend:test
            install: true
            python: "3.12"

          - name: backend - test - 3.13
            task: backend:test
            install: true
            python: "3.13"
            annotations_pytest: true
            pytest_coverage: true

          - name: backend - test - 3.14
            task: backend:test
            install: true
            python: "3.14"

          - name: backend - packaging test
            task: backend:packaging:test
            install: true
    steps:
      - name: ${{ matrix.name }}
        uses: juftin/actions/taskfile@5a54b64fe07d8de40f92676cae6b56c565ec28b2 # v1
        with:
          task: ${{ matrix.task }}
          checkout: true
          install: ${{ matrix.install || false }}
          setup-uv: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          annotations-ruff: ${{ matrix.annotations_ruff || false }}
          annotations-mypy: ${{ matrix.annotations_mypy || false }}
          annotations-pytest: ${{ matrix.annotations_pytest || false }}
          pytest-coverage: ${{ matrix.pytest_coverage && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork || false }}
        env:
          UV_PYTHON: ${{ matrix.python || '' }}

  frontend:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend - format
            task: frontend:fmt:check
            install: true

          - name: frontend - lint
            task: frontend:lint
            install: true

          - name: frontend - type check
            task: frontend:check
            install: true

          - name: frontend - test
            task: frontend:test
            install: true
    steps:
      - name: ${{ matrix.name }}
        uses: juftin/actions/taskfile@5a54b64fe07d8de40f92676cae6b56c565ec28b2 # v1
        with:
          task: ${{ matrix.task }}
          checkout: true
          install: ${{ matrix.install || false }}
          setup-uv: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pre-commit
            task: pre-commit
            install: true
            fetch_depth: 0

          - name: mcp - bundle verify
            task: mcp:verify
            install: true

          - name: docs - check
            task: docs:check
            install: true

          - name: helm - chart test
            task: helm:test
            install: true

          - name: release - verification
            task: release:test
            install: true

          - name: api - contract check
            task: api:check
            install: true
    steps:
      - name: ${{ matrix.name }}
        uses: juftin/actions/taskfile@5a54b64fe07d8de40f92676cae6b56c565ec28b2 # v1
        with:
          task: ${{ matrix.task }}
          checkout: true
          install: ${{ matrix.install || false }}
          fetch-depth: ${{ matrix.fetch_depth || '1' }}
          setup-uv: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: ${{ matrix.name }}
    needs: [backend, frontend, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend - docker build
            task: build
            buildx: true
    steps:
      - name: ${{ matrix.name }}
        uses: juftin/actions/taskfile@5a54b64fe07d8de40f92676cae6b56c565ec28b2 # v1
        with:
          task: ${{ matrix.task }}
          checkout: true
          setup-uv: true
          buildx: ${{ matrix.buildx || false }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    name: ${{ matrix.name }}
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: search - postgres smoke
            task: search:smoke
            install: true

          - name: maps - browser verification
            task: maps:verify
            install: true

          - name: admin - live smoke
            task: admin:smoke
            install: true

          - name: standalone - smoke
            task: standalone:test
            install: true

          - name: helm - cluster smoke
            task: helm:smoke
            install: true
    steps:
      - name: ${{ matrix.name }}
        uses: juftin/actions/taskfile@5a54b64fe07d8de40f92676cae6b56c565ec28b2 # v1
        with:
          task: ${{ matrix.task }}
          checkout: true
          install: ${{ matrix.install || false }}
          setup-uv: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

  snapshots:
    name: ${{ matrix.name }}
    needs: [frontend]
    runs-on: macos-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ui - visual snapshots
            task: snapshot:check
            install: true
    steps:
      - name: ${{ matrix.name }}
        uses: juftin/actions/taskfile@5a54b64fe07d8de40f92676cae6b56c565ec28b2 # v1
        with:
          task: ${{ matrix.task }}
          checkout: true
          install: ${{ matrix.install || false }}
          setup-uv: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Snapshot Reports and Visual Diffs
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ui-snapshots-report
          path: |
            tmp/snapshots/REPORT.md
            tmp/snapshots/report.html
            tmp/snapshots/diffs/
            tmp/snapshots/current/
            tmp/snapshots/before/
          if-no-files-found: ignore
