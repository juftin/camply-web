---
name: CI

permissions:
  contents: read
  actions: write

on:
  workflow_call:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  release-checks:
    name: Release Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/setup-frontend
      - run: task release:test
  standalone-smoke:
    name: Standalone Install and Browser Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/setup-frontend
      - run: task frontend:browser:install
      - run: task standalone:test
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        if: always()
        with:
          name: standalone-smoke
          path: tmp/standalone-smoke*.png

  # ── Backend ──────────────────────────────────────────────────────────────

  backend-checks:
    name: Backend ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            cmd: task backend:lint
          - name: Type Check
            cmd: task backend:check
          - name: Tests
            cmd: task backend:test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
      - name: ${{ matrix.name }}
        run: ${{ matrix.cmd }}

  backend-docker:
    name: Backend Docker Build
    needs: [backend-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          files: ./docker-compose.yaml
          targets: backend
          push: false
          set: |
            *.cache-from=type=gha,scope=backend
            *.cache-to=type=gha,mode=max,scope=backend
        env:
          BACKEND_VERSION: ci-${{ github.sha }}

  # ── Frontend ─────────────────────────────────────────────────────────────

  frontend-checks:
    name: Frontend ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            cmd: task frontend:lint
          - name: Type Check
            cmd: task frontend:check
          - name: Tests
            cmd: task frontend:test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - name: ${{ matrix.name }}
        run: ${{ matrix.cmd }}

  api-contract:
    name: API Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/setup-frontend
      - run: task api:check

  search-smoke:
    name: PostgreSQL Search
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
      - run: task search:smoke

  map-verification:
    name: Map Database and Browser Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/setup-frontend
      - run: task frontend:browser:install
      - run: task maps:verify
      - name: Upload map verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: map-verification
          path: frontend/tmp/maps-*
          if-no-files-found: ignore

  admin-smoke:
    name: Admin Live Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/setup-frontend
      - run: task frontend:browser:install
      - run: task backend:migration:test
      - run: task admin:smoke

  ui-snapshots:
    name: UI Visual Snapshots
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - run: task frontend:browser:install
      - run: task snapshot:verify
      - run: task snapshot:check
        env:
          GITHUB_REPOSITORY: ""
      - name: Upload Snapshot Reports and Visual Diffs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-snapshots-report
          path: |
            frontend/snapshots/REPORT.md
            frontend/snapshots/report.html
            frontend/snapshots/diffs/
            frontend/snapshots/current/
            frontend/snapshots/before/
            frontend/tmp/snapshot-gallery/
          if-no-files-found: ignore

  frontend-docker:
    name: Frontend Docker Build
    needs: [frontend-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build frontend image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          files: ./docker-compose.yaml
          targets: frontend
          push: false
          set: |
            *.cache-from=type=gha,scope=frontend
            *.cache-to=type=gha,mode=max,scope=frontend
            frontend.args.CAMPLY_API_URL=
        env:
          FRONTEND_VERSION: ci-${{ github.sha }}
