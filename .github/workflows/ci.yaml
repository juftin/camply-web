---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Detect changed paths ────────────────────────────────────────────────
  # Lets downstream jobs skip when nothing in their domain has changed.

  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yaml'
              - '.github/actions/setup-backend/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yaml'
              - '.github/actions/setup-frontend/**'

  # ── Backend ──────────────────────────────────────────────────────────────

  backend-checks:
    name: Backend ${{ matrix.name }}
    needs: [changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    strategy:
      matrix:
        include:
          - name: Lint
            cmd: |
              uv run ruff format --check .
              uv run ruff check .
          - name: Type Check
            cmd: uv run mypy --ignore-missing-imports packages
          - name: Tests
            cmd: uv run pytest -v
    steps:
      - uses: ./.github/actions/setup-backend
      - name: ${{ matrix.name }}
        run: ${{ matrix.cmd }}

  backend-docker:
    name: Backend Docker Build
    needs: [changes, backend-checks]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          push: false
          tags: juftin/camply-backend:ci-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ── Frontend ─────────────────────────────────────────────────────────────

  frontend-checks:
    name: Frontend ${{ matrix.name }}
    needs: [changes]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    strategy:
      matrix:
        include:
          - name: Lint
            cmd: npm run lint
          - name: Type Check
            cmd: npm run typecheck
          - name: Tests
            cmd: npm run test:run
    steps:
      - uses: ./.github/actions/setup-frontend
      - name: ${{ matrix.name }}
        run: ${{ matrix.cmd }}

  # When only backend files change, run a fast frontend type check to catch
  # API contract drift between backend responses and frontend type definitions.
  frontend-typecheck-cross:
    name: Frontend Type Check (API contract)
    needs: [changes]
    if: ${{ needs.changes.outputs.backend == 'true' && needs.changes.outputs.frontend != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: ./.github/actions/setup-frontend
      - name: Type Check
        run: npm run typecheck

  frontend-docker:
    name: Frontend Docker Build
    needs: [changes, frontend-checks]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          push: false
          tags: juftin/camply-frontend:ci-${{ github.sha }}
          build-args: |
            CAMPLY_API_URL=
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
