---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Detect changed paths ────────────────────────────────────────────────
  # Lets downstream jobs skip when nothing in their domain has changed.

  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yaml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yaml'

  # ── Backend ──────────────────────────────────────────────────────────────

  backend-checks:
    name: Backend ${{ matrix.name }}
    needs: [changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    strategy:
      matrix:
        include:
          - name: Lint
            cmd: |
              uv run ruff format --check .
              uv run ruff check .
          - name: Type Check
            cmd: uv run mypy --ignore-missing-imports packages
          - name: Tests
            cmd: uv run pytest -v
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: backend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-packages
      - name: ${{ matrix.name }}
        run: ${{ matrix.cmd }}

  backend-docker:
    name: Backend Docker Build
    needs: [changes, backend-checks]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: juftin/camply-backend:ci-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ── Frontend ─────────────────────────────────────────────────────────────

  frontend-checks:
    name: Frontend ${{ matrix.name }}
    needs: [changes]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    strategy:
      matrix:
        include:
          - name: Lint
            cmd: npm run lint
          - name: Type Check
            cmd: npm run typecheck
          - name: Tests
            cmd: npm run test:run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ${{ matrix.name }}
        run: ${{ matrix.cmd }}

  frontend-docker:
    name: Frontend Docker Build
    needs: [changes, frontend-checks]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: juftin/camply-frontend:ci-${{ github.sha }}
          build-args: |
            CAMPLY_API_URL=
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
