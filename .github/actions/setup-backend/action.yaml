---
name: Setup Backend
description: >-
  Install Task runner, set up uv and Python, and synchronise the backend
  with all optional extras.

inputs:
  python-version:
    description: Python version to install
    default: "3.14"

runs:
  using: composite
  steps:
    - name: task - install task runner
      shell: bash
      run: |
        if ! command -v task >/dev/null 2>&1; then
          curl -sL https://taskfile.dev/install.sh | sh -s -- -d -b "$HOME/.local/bin" v3.41.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        fi

    - name: uv - setup uv and python
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        cache-suffix: backend
        python-version: ${{ inputs.python-version }}

    - name: backend - install dependencies
      shell: bash
      run: task backend:install
