---
name: Setup Frontend
description: >-
  Install Task runner, set up Node.js with pnpm caching, and install frontend
  dependencies.

inputs:
  node-version:
    description: Node.js version to install
    default: "24"

runs:
  using: composite
  steps:
    - name: task - install task runner
      shell: bash
      run: |
        if ! command -v task >/dev/null 2>&1; then
          curl -sL https://taskfile.dev/install.sh | sh -s -- -d -b "$HOME/.local/bin" v3.41.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        fi

    - name: pnpm - setup package manager
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: ./package.json

    - name: node - setup node runtime
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ./pnpm-lock.yaml

    - name: frontend - install dependencies
      shell: bash
      run: task frontend:install
