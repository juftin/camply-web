# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  install:
    desc: Install Frontend Dependencies
    cmds:
      - npm install

  dev:
    desc: Run Frontend Development Server
    cmds:
      - npm run dev
    deps: [install]

  build:
    desc: Build Frontend for Production
    cmds:
      - npm run build
      - task: docker
    deps: [install]

  lint:
    desc: Lint Frontend Code
    cmds:
      - npm run lint
    deps: [install]

  check:
    desc: Run Frontend TypeScript Type Checking
    cmds:
      - npm run typecheck
    deps: [install]

  fix:
    desc: Fix Frontend Code with Linters and Formatters
    cmds:
      - npm run fix

  preview:
    desc: Preview Production Build
    cmds:
      - npm run preview
    deps: [build]

  clean:
    desc: Clean Build Artifacts
    cmds:
      - rm -rf dist node_modules

  docker:
    desc: Build Docker Image
    cmd: docker buildx bake --file docker-compose.yaml frontend
    env:
      FRONTEND_VERSION:
        sh: npm pkg get version | jq -r

  codegen:
    desc: Generate TypeScript API Client from OpenAPI Schema
    cmds:
      - npm run codegen
    deps: [install]

  test:
    desc: Run Frontend Tests
    cmds:
      - npm run test:run {{.CLI_ARGS}}
    deps: [install]

  snapshot:
    desc: Capture UI Snapshots and Generate Visual Comparison Report
    cmds:
      - npm run snapshot
    deps: [install]

  snapshot:update:
    desc: Update UI Snapshot Baselines with Current State
    cmds:
      - npm run snapshot:update
    deps: [install]

  snapshot:check:
    desc: Verify UI Snapshots Match Baseline (Fails on Regressions)
    cmds:
      - npm run snapshot:check
    deps: [install]
