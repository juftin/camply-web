# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  install:
    desc: Install Frontend Dependencies
    cmds:
      - pnpm install --frozen-lockfile

  dev:
    desc: Run Frontend Development Server
    cmds:
      - pnpm run dev
    deps: [install]

  build:
    desc: Build Frontend for Production
    cmds:
      - task: build:static
      - task: docker

  build:static:
    desc: Build Frontend Assets for Static Hosting
    cmds:
      - pnpm run build
    deps: [install]

  lint:
    desc: Lint Frontend Code
    cmds:
      - pnpm run lint
    deps: [install]

  check:
    desc: Run Frontend TypeScript Type Checking
    cmds:
      - pnpm run typecheck
    deps: [install]

  fix:
    desc: Fix Frontend Code with Linters and Formatters
    cmds:
      - pnpm run fix

  preview:
    desc: Preview Production Build
    cmds:
      - pnpm run preview
    deps: [build]

  clean:
    desc: Clean Build Artifacts
    cmds:
      - rm -rf dist node_modules

  docker:
    desc: Build Docker Image
    cmd: docker buildx bake --file docker-compose.yaml frontend
    env:
      FRONTEND_VERSION:
        sh: node -p "require('./package.json').version"

  codegen:
    env:
      CAMPLY_OPENAPI_SCHEMA: '{{.OPENAPI_SCHEMA | default .CAMPLY_OPENAPI_SCHEMA | default ""}}'
    desc: Generate TypeScript API Client from OpenAPI Schema
    cmds:
      - pnpm run codegen {{.CLI_ARGS}}
    deps: [install]

  test:
    desc: Run Frontend Tests
    cmds:
      - pnpm run test:run {{.CLI_ARGS}}
    deps: [install]

  browser:install:
    desc: Install Chromium and browser system dependencies for smoke tests
    cmds:
      - pnpm exec playwright install --with-deps chromium
    deps: [install]

  snapshot:
    desc: Capture UI Snapshots and Generate Visual Comparison Report
    cmds:
      - pnpm run snapshot
    deps: [install]

  snapshot:update:
    desc: Update UI Snapshot Baselines with Current State
    cmds:
      - pnpm run snapshot:update
    deps: [install]

  snapshot:check:
    desc: Verify UI Snapshots Match Baseline (Fails on Regressions)
    cmds:
      - pnpm run snapshot:check
    deps: [install]

  snapshot:report:
    desc: Generate a portable comparison gallery without capturing screenshots
    cmds:
      - pnpm exec tsx scripts/run-snapshots.ts --report-only
    deps: [install]

  snapshot:verify:
    desc: Verify the local HTML gallery without a server or network
    cmds:
      - pnpm exec tsx scripts/verify-snapshot-gallery.ts
    deps: [install]
