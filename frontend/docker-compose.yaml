services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - CAMPLY_API_URL=http://backend:8000/api
        - VITE_ENABLE_COMMUNITY_PAGES=${VITE_ENABLE_COMMUNITY_PAGES:-false}
        - VITE_MAP_TILE_URL=${VITE_MAP_TILE_URL:-}
        - VITE_MAP_ATTRIBUTION_TEXT=${VITE_MAP_ATTRIBUTION_TEXT:-}
        - VITE_MAP_ATTRIBUTION_URL=${VITE_MAP_ATTRIBUTION_URL:-}
        - VITE_MAP_MAX_NATIVE_ZOOM=${VITE_MAP_MAX_NATIVE_ZOOM:-19}
    image: ghcr.io/juftin/camply-frontend:${FRONTEND_VERSION:-local}
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
