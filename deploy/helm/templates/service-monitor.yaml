{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "camply.fullname" . }}-metrics
  labels: {{ mergeOverwrite (deepCopy .Values.serviceMonitor.labels) (include "camply.labels" . | fromYaml) | toYaml | nindent 4 }}
  annotations: {{ toYaml .Values.serviceMonitor.annotations | nindent 4 }}
spec:
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      camply.io/metrics: "true"
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
