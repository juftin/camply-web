{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "camply.fullname" . }}-connection-test
  labels: {{ include "camply.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  activeDeadlineSeconds: 60
  securityContext: {{ toYaml .Values.backend.podSecurityContext | nindent 4 }}
  {{- include "camply.scheduling" . | nindent 2 }}
  containers:
    - name: connection-test
      image: {{ include "camply.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: [python, -c]
      args:
        - |
          import urllib.request
          urls = ["http://{{ include "camply.fullname" . }}-backend:{{ .Values.backend.service.port }}/api/health"]
          {{- if .Values.frontend.enabled }}
          urls.append("http://{{ include "camply.fullname" . }}-frontend:{{ .Values.frontend.service.port }}/api/health")
          {{- end }}
          for url in urls:
              with urllib.request.urlopen(url, timeout=10) as response:
                  if response.status != 200:
                      raise SystemExit("Health check failed")
          print("Camply API and configured frontend proxy checks passed")
      securityContext: {{ toYaml .Values.securityContext | nindent 8 }}
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 128Mi}
{{- end }}
