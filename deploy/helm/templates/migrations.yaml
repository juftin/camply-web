apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "camply.fullname" . }}-startup
  labels: {{ include "camply.labels" . | nindent 4 }}
data:
  wait.py: |
    {{- .Files.Get "files/wait.py" | nindent 4 }}
  migrate.py: |
    {{- .Files.Get "files/migrate.py" | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "camply.fullname" . }}-migration-wait
  labels: {{ include "camply.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "camply.fullname" . }}-migration-wait
  labels: {{ include "camply.labels" . | nindent 4 }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    resourceNames: [{{ include "camply.migrationName" . }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "camply.fullname" . }}-migration-wait
  labels: {{ include "camply.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "camply.fullname" . }}-migration-wait
subjects:
  - kind: ServiceAccount
    name: {{ include "camply.fullname" . }}-migration-wait
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "camply.migrationName" . }}
  labels: {{ include "camply.labels" . | nindent 4 }}
spec:
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "camply.selector" (dict "root" . "role" "migrations") | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {{ toYaml .Values.backend.podSecurityContext | nindent 8 }}
      {{- include "camply.scheduling" . | nindent 6 }}
      initContainers:
        - name: wait-for-db
          image: {{ include "camply.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, /startup/wait.py]
          args: [--database, --timeout, {{ .Values.migrations.activeDeadlineSeconds | quote }}]
          env: {{ include "camply.env" (dict "root" . "role" "backend" "config" .Values.backend) | nindent 12 }}
          envFrom: {{ concat .Values.envFrom .Values.backend.envFrom | toYaml | nindent 12 }}
          securityContext: {{ toYaml .Values.securityContext | nindent 12 }}
          resources: {{ toYaml .Values.migrations.resources | nindent 12 }}
          volumeMounts:
            - {name: startup, mountPath: /startup, readOnly: true}
      containers:
        - name: migrate
          image: {{ include "camply.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, /startup/migrate.py]
          args: [--job, {{ include "camply.migrationName" . }}]
          env: {{ include "camply.env" (dict "root" . "role" "backend" "config" .Values.backend) | nindent 12 }}
          envFrom: {{ concat .Values.envFrom .Values.backend.envFrom | toYaml | nindent 12 }}
          securityContext: {{ toYaml .Values.securityContext | nindent 12 }}
          resources: {{ toYaml .Values.migrations.resources | nindent 12 }}
          volumeMounts:
            - {name: startup, mountPath: /startup, readOnly: true}
      volumes:
        - name: startup
          configMap:
            name: {{ include "camply.fullname" . }}-startup
