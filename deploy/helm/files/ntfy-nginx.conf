pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # Match the home-ops endpoint allowlist, including GET write aliases being denied.
  map "$request_method:$uri" $ntfy_read_allowed {
    default 0;
    "~^GET:/([-_A-Za-z0-9]{1,64}(,[-_A-Za-z0-9]{1,64})*/(json|sse|raw|ws|auth)|[-_A-Za-z0-9]{1,64})?$" 1;
    "~^GET:/(config\\.js|manifest\\.webmanifest|app\\.html|sw\\.js(\\.map)?|static/.+|v1/(health|config|account))$" 1;
    "~^(GET|HEAD):/file/[-_A-Za-z0-9]{1,64}(\\.[A-Za-z0-9]{1,16})?$" 1;
  }
  server {
    listen 8081;
    location / {
      if ($ntfy_read_allowed = 0) { return 404; }
      proxy_pass http://127.0.0.1:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
  }
}
