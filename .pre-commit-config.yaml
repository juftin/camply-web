# yaml-language-server: $schema=https://json.schemastore.org/pre-commit-config.json

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.snap$
      - id: end-of-file-fixer
        exclude: mkdocs.yaml
      - id: check-yaml
        exclude: mkdocs.yaml
      - id: check-ast
      - id: check-docstring-first
        # This token-based hook mistakes valid module attribute docstrings for
        # duplicate module docstrings. Syntax checks still cover these modules.
        exclude: ^backend/(src/camply/(__about__|db/(models/search|search_maps|search_bounds|migrations/env)|server/(routers/search|services/operations))|tests/packaging/conftest)\.py$
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.16.0
    hooks:
      - id: pretty-format-toml
        args: [--autofix, --no-sort]

  - repo: local
    hooks:
      - id: ruff-format
        name: format
        description: Runs Code Auto-Formatters
        entry: uv run --project backend --all-extras ruff format
        language: system
        types:
          - python
      - id: ruff-check
        name: lint
        description: Runs Code Linters
        entry: uv run --project backend --all-extras ruff check --fix
        language: system
        types:
          - python
      - id: import-linter
        name: import architecture
        entry: task backend:imports
        language: system
        pass_filenames: false
        files: ^backend/(src/.*\.py|pyproject\.toml)$
      - id: oxfmt
        # TOML is already formatted by pretty-format-toml above.
        exclude: \.toml$
        name: oxfmt
        description: Opinionated Code Formatter
        entry: pnpm --dir ./frontend run format
        args: [--write, --no-error-on-unmatched-pattern]
        language: system
        types:
          - text
