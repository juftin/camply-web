# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

env:
  LD_LIBRARY_PATH:
    sh: test -d /tmp/camply-browser-deps/root/usr/lib/x86_64-linux-gnu && echo "/tmp/camply-browser-deps/root/usr/lib/x86_64-linux-gnu:/tmp/camply-browser-deps/root/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH" || echo "$LD_LIBRARY_PATH"
  FONTCONFIG_PATH:
    sh: test -d /tmp/camply-browser-deps && echo "/tmp/camply-browser-deps" || echo "$FONTCONFIG_PATH"

tasks:
  install:
    summary: Install Frontend Dependencies
    cmds:
      - cmd: |
          if ! command -v pnpm >/dev/null 2>&1; then
            corepack enable pnpm 2>/dev/null || npm install -g pnpm@12
          fi
          pnpm install --frozen-lockfile

  dev:
    desc: Run Frontend Development Server
    cmds:
      - pnpm run dev
    deps: [install]

  build:
    desc: Build Frontend for Production
    cmds:
      - task: build:static
      - task: docker

  build:static:
    summary: Build Frontend Assets for Static Hosting
    cmds:
      - pnpm run build
    deps: [install]

  build:standalone:
    summary: Build assets for root hosting by the Python application
    env:
      CAMPLY_STANDALONE_BUILD: "1"
      VITE_API_URL: /api
    cmds:
      - pnpm run build
    deps: [install]

  lint:
    summary: Lint Frontend Code (Oxlint)
    cmds:
      - pnpm run lint
    deps: [install]

  fmt:check:
    summary: Verify Frontend Code Formatting (Oxfmt)
    cmds:
      - pnpm exec oxfmt -c src/frontend/.oxfmtrc.json --ignore-path src/frontend/.oxfmtignore --ignore-path .oxfmtignore --check .
    deps: [install]

  check:
    summary: Run Frontend TypeScript Type Checking (tsc)
    cmds:
      - pnpm run typecheck
    deps: [install]

  fix:
    summary: Fix Frontend Code with Linters and Formatters
    cmds:
      - pnpm run fix
    deps: [install]

  preview:
    summary: Preview Production Build
    cmds:
      - pnpm run preview
    deps: [build]

  clean:
    summary: Clean Build Artifacts
    cmds:
      - rm -rf build/frontend src/frontend/dist node_modules

  docker:
    internal: true
    cmds:
      - task: :build

  codegen:
    env:
      CAMPLY_OPENAPI_SCHEMA: '{{.OPENAPI_SCHEMA | default .CAMPLY_OPENAPI_SCHEMA | default ""}}'
    desc: Generate TypeScript API Client from OpenAPI Schema
    cmds:
      - pnpm run codegen {{.CLI_ARGS}}
    deps: [install]

  test:
    desc: Run Frontend Tests
    cmds:
      - pnpm run test:run {{.CLI_ARGS}}
    deps: [install]

  browser:install:
    summary: Install Chromium and browser system dependencies for smoke tests
    status:
      - test -d ~/.cache/ms-playwright
    cmds:
      - pnpm exec playwright install --with-deps chromium
    deps: [install]

  snapshot:
    summary: Capture UI Snapshots and Generate Visual Comparison Report
    cmds:
      - pnpm run snapshot {{.CLI_ARGS}}
    deps: [install]

  snapshot:update:
    summary: Update UI Snapshot Baselines with Current State
    cmds:
      - pnpm run snapshot:update {{.CLI_ARGS}}
    deps: [install]

  snapshot:check:
    summary: Verify UI Snapshots Match Baseline (Fails on Regressions)
    env:
      GITHUB_REPOSITORY: ""
    cmds:
      - pnpm run snapshot:check {{.CLI_ARGS}}
    deps: [install]

  snapshot:report:
    summary: Generate a local comparison gallery without capturing screenshots
    cmds:
      - pnpm exec tsx src/frontend/tooling/run-snapshots.ts --report-only
    deps: [install]

  snapshot:verify:
    summary: Verify snapshot navigation and the offline HTML gallery
    cmds:
      - pnpm exec tsx src/frontend/tooling/verify-snapshot-navigation.ts
      - pnpm exec tsx src/frontend/tooling/verify-snapshot-gallery.ts
    deps: [install]

  pages:check:
    summary: Validate and exercise the local Pages project without credentials
    deps: [build:standalone]
    cmds:
      - pnpm exec vitest run src/frontend/test/pages-proxy.test.ts src/frontend/tooling/pages.test.ts
      - pnpm exec tsx src/frontend/tooling/verify-pages.ts

  pages:dev:
    summary: Serve the compiled frontend and Functions locally
    deps: [build:standalone]
    cmds:
      - pnpm exec wrangler --cwd src/frontend pages dev
