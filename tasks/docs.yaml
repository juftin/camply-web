# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  install:
    desc: Install documentation dependencies
    cmd: pnpm install --frozen-lockfile

  build:
    desc: Build the documentation into build/docs
    cmd: pnpm run docs:build -- {{.CLI_ARGS}}

  serve:
    desc: Preview documentation at http://127.0.0.1:8001
    cmd: pnpm run docs:dev -- {{.CLI_ARGS}}

  preview:
    desc: Preview built documentation at http://127.0.0.1:8001
    cmd: pnpm run docs:preview -- {{.CLI_ARGS}}

  check:
    desc: Build documentation and verify rendered links and Pages publishing
    cmds:
      - task: build
      - uv run python -m unittest discover -s tests/docs -v
