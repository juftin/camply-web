# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  install:
    summary: Install docs dependencies
    cmds:
      - task: :frontend:install

  build:
    summary: Build docs into build/docs
    cmds:
      - pnpm run docs:build -- {{.CLI_ARGS}}
    deps: [install]

  serve:
    desc: Preview docs at http://127.0.0.1:8001
    cmds:
      - pnpm run docs:dev -- {{.CLI_ARGS}}
    deps: [install]

  preview:
    summary: Preview built docs at http://127.0.0.1:8001
    cmds:
      - pnpm run docs:preview -- {{.CLI_ARGS}}
    deps: [install]

  check:
    summary: Build docs and verify rendered links and Pages publishing
    cmds:
      - task: build
      - uv run python -m unittest discover -s tests/docs -v
