volumes:
  db_data:
    driver: local
  valkey_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

services:
  valkey:
    image: valkey/valkey:8-alpine
    command: valkey-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: juftin/camply-backend:${BACKEND_VERSION:-local}
    depends_on:
      db:
        condition: service_healthy
    volumes: []
    environment:
      CAMPLY_DB_DRIVERNAME: "postgresql+psycopg"
      CAMPLY_DB_HOST: "db"
      CAMPLY_DB_USERNAME: ${POSTGRES_USER:-camply}
      CAMPLY_DB_PASSWORD: ${POSTGRES_PASSWORD:-camply}
      CAMPLY_DB_DATABASE: ${POSTGRES_DB:-camply}
      CAMPLY_DB_PORT: 5432
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      CAMPLY_BASIC_AUTH_USERNAME: ${CAMPLY_BASIC_AUTH_USERNAME:-admin}
      CAMPLY_BASIC_AUTH_PASSWORD: ${CAMPLY_BASIC_AUTH_PASSWORD:-camply}
      PROMETHEUS_MULTIPROC_DIR: "/tmp/prometheus_multiproc"
      CAMPLY_PROMETHEUS_MULTIPROC_DIR: "/tmp/prometheus_multiproc"
    healthcheck:
      test: ["CMD", "curl", "-f", "-u", "${CAMPLY_BASIC_AUTH_USERNAME:-admin}:${CAMPLY_BASIC_AUTH_PASSWORD:-camply}", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "8000:8000"

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-camply}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-camply}
      POSTGRES_DB: ${POSTGRES_DB:-camply}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-camply}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    ports:
      - 5432:5432
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: juftin/camply-worker:${BACKEND_VERSION:-local}
    command: celery -A worker.celery_app worker -l info -Q celery --concurrency=4
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes: []
    environment:
      CAMPLY_DB_DRIVERNAME: "postgresql+psycopg"
      CAMPLY_DB_HOST: "db"
      CAMPLY_DB_USERNAME: ${POSTGRES_USER:-camply}
      CAMPLY_DB_PASSWORD: ${POSTGRES_PASSWORD:-camply}
      CAMPLY_DB_DATABASE: ${POSTGRES_DB:-camply}
      CAMPLY_DB_PORT: 5432
      CAMPLY_VALKEY_URL: "redis://valkey:6379/0"
      CAMPLY_SENTRY_DSN: ${SENTRY_DSN:-}
      CAMPLY_SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
      CAMPLY_METRICS_PORT: 8001
      PROMETHEUS_MULTIPROC_DIR: "/tmp/prometheus_multiproc"
      CAMPLY_PROMETHEUS_MULTIPROC_DIR: "/tmp/prometheus_multiproc"
      PUSHOVER_APP_TOKEN: ${PUSHOVER_APP_TOKEN:-}
      SKIP_MIGRATIONS: "1"
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: juftin/camply-beat:${BACKEND_VERSION:-local}
    command: sh -c "celery -A worker.celery_app call worker.tasks.ingestion.populate_database --expires=600 && celery -A worker.celery_app beat -l info"
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes: []
    environment:
      CAMPLY_DB_DRIVERNAME: "postgresql+psycopg"
      CAMPLY_DB_HOST: "db"
      CAMPLY_DB_USERNAME: ${POSTGRES_USER:-camply}
      CAMPLY_DB_PASSWORD: ${POSTGRES_PASSWORD:-camply}
      CAMPLY_DB_DATABASE: ${POSTGRES_DB:-camply}
      CAMPLY_DB_PORT: 5432
      CAMPLY_VALKEY_URL: "redis://valkey:6379/0"
      CAMPLY_SENTRY_DSN: ${SENTRY_DSN:-}
      CAMPLY_SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
      SKIP_MIGRATIONS: "1"
      CAMPLY_METRICS_PORT: 8001
      PROMETHEUS_MULTIPROC_DIR: "/tmp/prometheus_multiproc"
      CAMPLY_PROMETHEUS_MULTIPROC_DIR: "/tmp/prometheus_multiproc"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--storage.tsdb.retention.time=30d"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-camply}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
