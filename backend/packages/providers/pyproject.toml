[project]
name = "providers"
version = "0.1.0"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = [
  # First Party
  "db",
  # Third Party
  "pydantic>=2,<3",
  "httpx>=0.28.0,<0.29.0",
  "platformdirs>=4,<5",
  "structlog>=24,<27",
  "rich>=14,<16",
  "click>=8,<9",
  "fake-useragent>=2.2.0"
]

[project.scripts]
populate-database = "providers.cli:populate_database"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11.0,<0.18.0",
  "mypy>=1,<3",
  "pip>=24,<27",
  "pytest-vcr>=1.0.2"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["providers"]
