[project]
name = "camply"
version = "0.1.0"
description = "The Campsite Finder - Find campsites at sold-out campgrounds"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.12"
dependencies = [
  "camply-core",
  "click>=8.1.0",
  "rich>=13.0.0",
  "platformdirs>=4.0.0",
  "pydantic-settings>=2.0.0",
  "pydantic>=2.0.0",
  "httpx>=0.28.0,<0.29.0"
]

[project.scripts]
camply = "camply.app:cli"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.26,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.11.0,<0.12.0",
  "mypy>=1,<2"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["camply"]
