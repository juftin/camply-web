[project]
name = "worker"
version = "0.1.0"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = [
  # First Party
  "db",
  "providers",
  # Broker / Task Queue
  "celery[redis]>=5.4,<6",
  "redis>=5,<9",
  # HTTP (for Pushover notifications)
  "httpx>=0.28.0,<0.29.0",
  # Config
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  # Logging
  "structlog>=24,<27",
  # Monitoring
  "sentry-sdk>=2,<3",
  "prometheus-client>=0.21,<1"
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11.0,<0.18.0",
  "mypy>=1,<3",
  "pip>=24,<27",
  "pytest-vcr>=1.0.2"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
