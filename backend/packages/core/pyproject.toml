[project]
name = "camply-core"
version = "0.1.0"
description = "Core domain models, search engine, and booking providers for camply"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2,<3",
  "httpx>=0.28.0,<0.29.0",
  "structlog>=25,<26",
  "fake-useragent>=2.2.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["camply_core"]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.26,<1",
  "pytest-cov>=6,<7",
  "pytest-vcr>=1.0.2",
  "ruff>=0.11.0,<0.12.0",
  "mypy>=1,<2"
]
