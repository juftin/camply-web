# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

includes:
  frontend:
    taskfile: frontend/Taskfile.yaml
    dir: frontend
  backend:
    taskfile: backend/Taskfile.yaml
    dir: backend

tasks:
  install:
    desc: Install All Dependencies (Backend + Frontend)
    cmds:
      - task: backend:install
      - task: frontend:install

  test:
    desc: Run All Tests (Backend + Frontend)
    cmds:
      - task: backend:test
      - task: frontend:test

  snapshot:
    desc: Run UI Visual Snapshots and Generate Comparison Report
    cmds:
      - task: frontend:snapshot

  snapshot:update:
    desc: Update UI Visual Snapshot Baselines
    cmds:
      - task: frontend:snapshot:update

  snapshot:check:
    desc: Verify UI Visual Snapshots Match Baselines (CI Gate)
    cmds:
      - task: frontend:snapshot:check

  lint:
    desc: Lint All Code (Backend + Frontend)
    cmds:
      - task: backend:lint
      - task: frontend:lint

  check:
    desc: Run Type Checking (Backend + Frontend)
    cmds:
      - task: backend:check
      - task: frontend:check

  fix:
    desc: Fix All Code with Linters and Formatters
    deps:
      - task: backend:fix
      - task: frontend:fix

  build:
    desc: Build the Project Artifacts
    cmds:
      - task: backend:build
      - task: frontend:build

  publish:
    desc: Publish the Project Artifacts
    cmds:
      - echo "Publishing Project Artifacts..."
    deps: [build]
    requires:
      vars: [CI]

  version:
    desc: Get/Set Project Versions
    cmds:
      - task: backend:version

  pre-commit:
    desc: Run Pre-Commit Hooks
    cmds:
      - uv tool run --isolated pre-commit run {{.CLI_ARGS}}
    status:
      - test ! -f .pre-commit-config.yaml
    deps: [pre-commit-install]

  admin:provision:
    desc: Provision an Administrator by User UUID
    cmds:
      - task: backend:admin:provision
        vars:
          CLI_ARGS: "{{.CLI_ARGS}}"

  dev:
    desc: Run Full Stack Development (Backend + Frontend)
    deps: ["frontend:dev", "backend:dev"]

  run:
    desc: Run the project with Docker Compose
    cmds:
      - docker compose up --build

  compose:up:
    desc: Start All Services in Background with Docker Compose
    cmds:
      - docker compose up -d --build {{.CLI_ARGS}}

  compose:down:
    desc: Stop All Docker Compose Services
    cmds:
      - docker compose down {{.CLI_ARGS}}

  compose:logs:
    desc: Follow Docker Compose Logs
    cmds:
      - docker compose logs -f {{.CLI_ARGS}}

  compose:ps:
    desc: List Docker Compose Service Statuses
    cmds:
      - docker compose ps {{.CLI_ARGS}}

  compose:restart:
    desc: Restart Docker Compose Services
    cmds:
      - docker compose restart {{.CLI_ARGS}}

  compose:infra:
    desc: Start Backing Infrastructure Only (PostgreSQL + Valkey)
    cmds:
      - docker compose up -d db valkey {{.CLI_ARGS}}

  default:
    desc: List Available Tasks
    cmds:
      - task --list-all

  ########################
  # INTERNAL TASKS
  ########################

  pre-commit-install:
    desc: Install Pre-Commit Hooks
    internal: true
    cmds:
      - cmd: |
          if [ "{{.SKIP_PRECOMMIT | default 0}}" = "0" ]; then
              uv tool run --isolated pre-commit install --install-hooks
          fi
        silent: true
    status:
      - test ! -f ../.pre-commit-config.yaml
