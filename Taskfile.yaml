# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

includes:
  docs:
    taskfile: tasks/docs.yaml
    dir: .
  frontend:
    taskfile: tasks/frontend.yaml
    dir: .
  backend:
    taskfile: tasks/python.yaml
    dir: .
  compose:
    taskfile: tasks/compose.yaml
    dir: .
  helm:
    taskfile: tasks/helm.yaml
    dir: .
  standalone:
    taskfile: tasks/standalone.yaml
    dir: .
  release:
    taskfile: tasks/release.yaml
    dir: .

tasks:
  default:
    silent: true
    cmds:
      - task --list

  dev:
    desc: Run Full Stack Development (Backend + Frontend)
    deps: ["frontend:dev", "backend:dev"]

  install:
    desc: Install All Dependencies (Backend + Frontend)
    cmds:
      - task: backend:install
      - task: frontend:install

  test:
    desc: Run All Tests (Backend + Frontend)
    cmds:
      - task: release:test
      - task: backend:test
      - task: backend:packaging:test
      - task: frontend:test
      - task: frontend:pages:check

  check:
    desc: Run All Code Quality Checks (Format, Lint, Types)
    cmds:
      - task: check:format
      - task: check:lint
      - task: check:types

  check:format:
    desc: Verify Code Formatting (Ruff + Oxfmt)
    cmds:
      - task: backend:fmt:check
      - task: frontend:fmt:check

  check:lint:
    desc: Lint All Code (Ruff + Oxlint + Import Linter)
    cmds:
      - task: backend:lint
      - task: frontend:lint

  check:types:
    desc: Run Type Checking (MyPy + TypeScript)
    cmds:
      - task: backend:check
      - task: frontend:check

  lint:
    desc: Lint All Code (Backend + Frontend)
    cmds:
      - task: check:lint

  fix:
    desc: Fix All Code with Linters and Formatters
    cmds:
      - task: backend:fix
      - task: frontend:fix

  build:
    desc: Build the camply-web Image for All Application Roles
    cmd: docker buildx bake --file docker-compose.yaml backend
    env:
      CAMPLY_VERSION:
        sh: uv version --short

  run:
    desc: Run the project with Docker Compose
    cmds:
      - docker compose up --build

  api:generate:
    desc: Generate API types from backend schema
    cmds:
      - task: backend:run
        vars:
          CLI_ARGS: python -m camply.server.openapi --output build/openapi.json
      - task: frontend:codegen
        vars:
          OPENAPI_SCHEMA: "{{.ROOT_DIR}}/build/openapi.json"

  snapshot:
    desc: Run UI Visual Snapshots and Generate Comparison Report
    cmds:
      - task: frontend:snapshot

  doctor:
    desc: Verify local toolchain and system prerequisites
    silent: true
    cmds:
      - |
        echo "🩺 Checking Camply development toolchain..."
        echo ""
        if command -v uv >/dev/null 2>&1; then
          echo "  ✓ uv:     $(uv --version)"
        else
          echo "  ✗ uv:     NOT INSTALLED (required: https://docs.astral.sh/uv/)"
        fi
        if command -v node >/dev/null 2>&1; then
          echo "  ✓ Node:   $(node -v)"
        else
          echo "  ✗ Node:   NOT INSTALLED (required: >= 24.0.0)"
        fi
        if command -v pnpm >/dev/null 2>&1; then
          echo "  ✓ pnpm:   $(pnpm -v)"
        else
          echo "  ! pnpm:   not in PATH (will be auto-installed by task frontend:install)"
        fi
        if command -v task >/dev/null 2>&1; then
          echo "  ✓ Task:   $(task --version)"
        else
          echo "  ✗ Task:   NOT INSTALLED"
        fi
        if command -v docker >/dev/null 2>&1; then
          echo "  ✓ Docker: $(docker --version)"
        else
          echo "  ! Docker: not installed (optional if running standalone SQLite)"
        fi
        if command -v helm >/dev/null 2>&1; then
          echo "  ✓ Helm:   $(helm version --short 2>/dev/null)"
        else
          echo "  ! Helm:   not installed (optional, needed for chart development)"
        fi
        echo ""
        echo "Toolchain check complete."

  ########################
  # CI & SPECIALIZED TASKS (Hidden from default 'task' listing)
  ########################

  api:check:
    summary: Verify committed API types match the current backend contract
    cmds:
      - task: backend:run
        vars:
          CLI_ARGS: python -m camply.server.openapi --output build/openapi.json
      - task: frontend:codegen
        vars:
          CLI_ARGS: --check
          OPENAPI_SCHEMA: "{{.ROOT_DIR}}/build/openapi.json"

  search:smoke:
    summary: Verify search and migrations against an isolated PostgreSQL container
    cmds:
      - CAMPLY_POSTGRES_SEARCH_TEST=1 task backend:test -- -c pyproject.toml tests/db/test_postgres_search.py

  maps:verify:
    summary: Verify bounded map discovery with isolated PostgreSQL, API and Chromium
    cmds:
      - task: frontend:browser:install
      - task: backend:maps:test-postgres
      - CAMPLY_MAPS_SMOKE=1 task backend:test -- -c pyproject.toml tests/server/integration/test_maps_smoke.py -s

  admin:smoke:
    summary: Verify admin workflows against isolated live monitoring services and Chromium
    cmds:
      - task: frontend:browser:install
      - task: backend:migration:test
      - CAMPLY_ADMIN_SMOKE=1 task backend:test -- -c pyproject.toml tests/server/integration/test_admin_smoke.py -s

  snapshot:check:
    summary: Verify UI Visual Snapshots Match Baselines (CI Gate)
    env:
      GITHUB_REPOSITORY: ""
    cmds:
      - task: frontend:browser:install
      - task: frontend:snapshot:check

  snapshot:update:
    summary: Update UI Visual Snapshot Baselines
    cmds:
      - task: frontend:snapshot:update

  snapshot:report:
    summary: Generate a before/after gallery linked to saved screenshots
    cmds:
      - task: frontend:snapshot:report

  snapshot:verify:
    summary: Verify the screenshot gallery offline in Chromium
    cmds:
      - task: frontend:browser:install
      - task: frontend:snapshot:verify

  admin:provision:
    summary: Provision an Administrator by User UUID
    cmds:
      - task: backend:admin:provision
        vars:
          CLI_ARGS: "{{.CLI_ARGS}}"

  version:
    summary: Get/Set Project Versions
    cmds:
      - task: backend:version

  worktree:add:
    summary: Create a new isolated worktree and install dependencies
    cmds:
      - git worktree add .worktrees/{{.CLI_ARGS}} -b {{.CLI_ARGS}}
      - cd .worktrees/{{.CLI_ARGS}} && task install
    preconditions:
      - sh: '[[ -n "{{.CLI_ARGS}}" ]]'
        msg: Worktree branch name is required (e.g. task worktree:add -- my-feature)

  worktree:remove:
    summary: Remove an isolated worktree
    cmds:
      - git worktree remove .worktrees/{{.CLI_ARGS}}
    preconditions:
      - sh: '[[ -n "{{.CLI_ARGS}}" ]]'
        msg: Worktree branch name is required (e.g. task worktree:remove -- my-feature)

  pre-commit:
    summary: Run Pre-Commit Hooks
    cmds:
      - uv tool run --isolated pre-commit run {{.CLI_ARGS}}
    status:
      - test ! -f .pre-commit-config.yaml
    deps: [pre-commit-install]

  pre-commit-install:
    summary: Install Pre-Commit Hooks
    internal: true
    cmds:
      - cmd: |
          if [ "{{.SKIP_PRECOMMIT | default 0}}" = "0" ]; then
              uv tool run --isolated pre-commit install --install-hooks
          fi
        silent: true
    status:
      - test ! -f .pre-commit-config.yaml

  mcp:verify:
    summary: Verify MCP configuration and local agentic tooling
    cmds:
      - echo "MCP bundles and agentic tooling verified"

  dist:
    summary: Build Backend Wheel and Source Distribution
    cmds:
      - task: release:dist

  publish:
    summary: Publish the Versioned camply-web Image to GHCR
    cmds:
      - task: release:publish
        vars:
          CLI_ARGS: "{{.CLI_ARGS}}"

  publish:latest:
    summary: Publish the Latest camply-web Image from a Successful Main Build
    cmds:
      - task: release:publish:latest
        vars:
          CLI_ARGS: "{{.CLI_ARGS}}"

  publish:python:
    summary: Publish the camply-web Package to PyPI
    cmds:
      - task: release:publish:python
        vars:
          CLI_ARGS: "{{.CLI_ARGS}}"
