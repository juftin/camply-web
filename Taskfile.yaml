# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

includes:
  frontend:
    taskfile: taskfiles/frontend.yaml
    dir: .
  backend:
    taskfile: taskfiles/python.yaml
    dir: .

tasks:
  standalone:install:
    desc: Install core Python and frontend build dependencies without backing services
    cmds:
      - uv sync --no-dev --no-default-groups --extra server
      - task: frontend:install

  standalone:build:
    desc: Build frontend and core Python wheels without Docker
    cmds:
      - rm -rf "{{.ROOT_DIR}}/dist"
      - uv build --wheel --out-dir "{{.ROOT_DIR}}/dist" --clear

  standalone:run:
    desc: Migrate SQLite and serve the complete application in one Python process
    env:
      CAMPLY_RUNTIME_MODE: standalone
      CAMPLY_FRONTEND_DIR: '{{.CAMPLY_FRONTEND_DIR | default (printf "%s/build/frontend" .ROOT_DIR)}}'
    cmds:
      - uv run --no-dev --extra server -- python -m camply.server.standalone {{.CLI_ARGS}}

  standalone:test:
    desc: Verify a core-only installed build, real SQLite recovery, and Chromium
    cmds:
      - task: standalone:build
      - CAMPLY_STANDALONE_SMOKE=1 task backend:test -- tests/server/integration/test_standalone_smoke.py -s

  install:
    desc: Install All Dependencies (Backend + Frontend)
    cmds:
      - task: backend:install
      - task: frontend:install

  test:
    desc: Run All Tests (Backend + Frontend)
    cmds:
      - task: release:test
      - task: backend:test
      - task: backend:packaging:test
      - task: frontend:test
      - task: frontend:pages:check

  api:generate:
    desc: Generate API types from the local backend schema without a running server
    cmds:
      - task: backend:run
        vars:
          CLI_ARGS: python -m camply.server.openapi --output build/openapi.json
      - task: frontend:codegen
        vars:
          OPENAPI_SCHEMA: "{{.ROOT_DIR}}/build/openapi.json"

  api:check:
    desc: Verify committed API types match the current backend contract
    cmds:
      - task: backend:run
        vars:
          CLI_ARGS: python -m camply.server.openapi --output build/openapi.json
      - task: frontend:codegen
        vars:
          CLI_ARGS: --check
          OPENAPI_SCHEMA: "{{.ROOT_DIR}}/build/openapi.json"

  search:smoke:
    desc: Verify search and migrations against an isolated PostgreSQL container
    cmds:
      - CAMPLY_POSTGRES_SEARCH_TEST=1 task backend:test -- -c pyproject.toml tests/db/test_postgres_search.py

  maps:verify:
    desc: Verify bounded map discovery with isolated PostgreSQL, API and Chromium
    deps: [frontend:install]
    cmds:
      - task: backend:maps:test-postgres
      - CAMPLY_MAPS_SMOKE=1 task backend:test -- -c pyproject.toml tests/server/integration/test_maps_smoke.py -s

  admin:smoke:
    desc: Verify admin workflows against isolated live monitoring services and Chromium
    deps: [frontend:install]
    cmds:
      - CAMPLY_ADMIN_SMOKE=1 task backend:test -- -c pyproject.toml tests/server/integration/test_admin_smoke.py -s

  snapshot:
    desc: Run UI Visual Snapshots and Generate Comparison Report
    cmds:
      - task: frontend:snapshot

  snapshot:update:
    desc: Update UI Visual Snapshot Baselines
    cmds:
      - task: frontend:snapshot:update

  snapshot:check:
    desc: Verify UI Visual Snapshots Match Baselines (CI Gate)
    cmds:
      - task: frontend:snapshot:check

  snapshot:report:
    desc: Generate a before/after gallery linked to saved screenshots
    cmds:
      - task: frontend:snapshot:report

  snapshot:verify:
    desc: Verify the screenshot gallery offline in Chromium
    cmds:
      - task: frontend:snapshot:verify

  lint:
    desc: Lint All Code (Backend + Frontend)
    cmds:
      - task: backend:lint
      - task: frontend:lint

  check:
    desc: Run Type Checking (Backend + Frontend)
    cmds:
      - task: backend:check
      - task: frontend:check

  fix:
    desc: Fix All Code with Linters and Formatters
    deps:
      - task: backend:fix
      - task: frontend:fix

  build:
    desc: Build the Project Artifacts
    cmd: docker buildx bake --file docker-compose.yaml backend frontend
    env:
      BACKEND_VERSION:
        sh: uv version --short
      FRONTEND_VERSION:
        sh: node -p "require('./package.json').version"

  publish:
    desc: Publish Versioned Backend and Frontend Images to GHCR
    cmds:
      - task: publish:images
        vars:
          RELEASE_VERSION: "{{.RELEASE_VERSION}}"
          IMAGE_VERSION: "{{.RELEASE_VERSION}}"
          CLI_ARGS: "{{.CLI_ARGS}}"
    requires:
      vars: [RELEASE_VERSION]
    preconditions:
      - sh: echo "$RELEASE_VERSION" | LC_ALL=C grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
        msg: RELEASE_VERSION must be a stable semantic version (for example 1.2.3).
    env:
      RELEASE_VERSION: "{{.RELEASE_VERSION}}"

  publish:latest:
    desc: Publish Latest Backend and Frontend Images from a Successful Main Build
    cmds:
      - task: publish:images
        vars:
          RELEASE_VERSION: latest
          IMAGE_VERSION: "sha-{{.GITHUB_SHA}}"
          CLI_ARGS: "{{.CLI_ARGS}}"
    requires:
      vars: [GITHUB_SHA]
    preconditions:
      - sh: test -n "$GITHUB_SHA"
        msg: GITHUB_SHA is required to identify the main build.
    env:
      GITHUB_SHA: "{{.GITHUB_SHA}}"

  release:prepare:
    desc: Stamp Release Versions in Backend and Frontend Build Metadata
    cmds:
      - env -u UV_LOCKED uv version --frozen "$RELEASE_VERSION"
      - env -u UV_LOCKED uv lock
      - |
        node --input-type=module -e '
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "package.json";
          const metadata = JSON.parse(readFileSync(path, "utf8"));
          metadata.version = process.env.RELEASE_VERSION;
          writeFileSync(path, JSON.stringify(metadata, null, 2) + "\n");
        '
    requires:
      vars: [RELEASE_VERSION]
    env:
      RELEASE_VERSION: "{{.RELEASE_VERSION}}"

  dist:
    desc: Build Backend Wheel and Source Distribution
    cmd: uv build --out-dir "{{.ROOT_DIR}}/dist" --clear

  release:test:
    desc: Verify Release Versions, Python Artifacts, and Docker Publication Plans
    cmd: node --test tests/release.test.mjs

  version:
    desc: Get/Set Project Versions
    cmds:
      - task: backend:version

  pre-commit:
    desc: Run Pre-Commit Hooks
    cmds:
      - uv tool run --isolated pre-commit run {{.CLI_ARGS}}
    status:
      - test ! -f .pre-commit-config.yaml
    deps: [pre-commit-install]

  admin:provision:
    desc: Provision an Administrator by User UUID
    cmds:
      - task: backend:admin:provision
        vars:
          CLI_ARGS: "{{.CLI_ARGS}}"

  dev:
    desc: Run Full Stack Development (Backend + Frontend)
    deps: ["frontend:dev", "backend:dev"]

  run:
    desc: Run the project with Docker Compose
    cmds:
      - docker compose up --build

  compose:up:
    desc: Start All Services in Background with Docker Compose
    cmds:
      - docker compose up -d --build {{.CLI_ARGS}}

  compose:down:
    desc: Stop All Docker Compose Services
    cmds:
      - docker compose down {{.CLI_ARGS}}

  compose:logs:
    desc: Follow Docker Compose Logs
    cmds:
      - docker compose logs -f {{.CLI_ARGS}}

  compose:ps:
    desc: List Docker Compose Service Statuses
    cmds:
      - docker compose ps {{.CLI_ARGS}}

  compose:restart:
    desc: Restart Docker Compose Services
    cmds:
      - docker compose restart {{.CLI_ARGS}}

  compose:infra:
    desc: Start Backing Infrastructure Only (PostgreSQL + Valkey)
    cmds:
      - docker compose up -d db valkey {{.CLI_ARGS}}

  default:
    desc: List Available Tasks
    cmds:
      - task --list-all

  ########################
  # INTERNAL TASKS
  ########################

  publish:images:
    internal: true
    cmd: >-
      RELEASE_VERSION='{{.RELEASE_VERSION}}'
      docker buildx bake --file docker-compose.yaml --file docker-bake.release.hcl --push
      --set '*.labels.org.opencontainers.image.version={{.IMAGE_VERSION}}'
      --set '*.labels.org.opencontainers.image.revision={{.GITHUB_SHA | default "local"}}'
      --set '*.labels.org.opencontainers.image.source=https://github.com/juftin/camply-web'
      --set 'backend.cache-from=type=gha,scope=backend'
      --set 'backend.cache-to=type=gha,mode=max,scope=backend'
      --set 'frontend.cache-from=type=gha,scope=frontend'
      --set 'frontend.cache-to=type=gha,mode=max,scope=frontend'
      --set 'frontend.args.CAMPLY_API_URL='
      {{.CLI_ARGS}}
      backend frontend
    preconditions:
      - sh: test "$CI" = true
        msg: Publishing requires CI=true and an authenticated GHCR session.

  pre-commit-install:
    desc: Install Pre-Commit Hooks
    internal: true
    cmds:
      - cmd: |
          if [ "{{.SKIP_PRECOMMIT | default 0}}" = "0" ]; then
              uv tool run --isolated pre-commit install --install-hooks
          fi
        silent: true
    status:
      - test ! -f .pre-commit-config.yaml
