# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  SOURCE_CODE: src/camply hatch_build.py
  PACKAGING_PYTHON: '{{.PACKAGING_PYTHON | default "3.14"}}'

env:
  UV_LOCKED: 1

tasks:
  install:
    desc: Install Project + Dev Dependencies
    cmds:
      - task: sync

  test:
    desc: Run Tests
    cmds:
      - uv run --all-extras -- pytest --ignore=tests/packaging {{.CLI_ARGS}}
    deps: [sync]

  packaging:test:
    desc: Verify Isolated Python Artifacts and Optional Extras
    cmds:
      - uv run --all-extras -- pytest tests/packaging {{.CLI_ARGS}}
    env:
      PACKAGING_PYTHON: "{{.PACKAGING_PYTHON}}"
    deps: [sync]

  fix:
    desc: Fix Code with Linters and Formatters
    cmds:
      - task: fmt
      - uv run --all-extras -- ruff check --fix {{.CLI_ARGS | default "src/camply tests hatch_build.py"}}
    deps: [sync]

  lint:
    desc: Run Formatting, Code, and Import Architecture Checks
    cmds:
      - uv run --all-extras -- ruff format --check {{.CLI_ARGS | default "src/camply tests hatch_build.py"}}
      - uv run --all-extras -- ruff check {{.CLI_ARGS | default "src/camply tests hatch_build.py"}}
      - task: imports
        vars:
          CLI_ARGS: ""
    deps: [sync]

  imports:
    desc: Enforce Python Module and Optional Dependency Boundaries
    cmds:
      - uv run --all-extras -- lint-imports {{.CLI_ARGS}}
    deps: [sync]

  run:
    desc: Run Command within Project (requires "--")
    cmds:
      - uv run --all-extras -- {{.CLI_ARGS}}
    deps: [sync]

  check:
    desc: Run Static Type Checkers
    cmds:
      - uv run --all-extras -- mypy {{.CLI_ARGS | default .SOURCE_CODE}}
    deps: [sync]

  fmt:
    desc: Run Code Formatters
    cmds:
      - uv run --all-extras -- ruff format {{.CLI_ARGS | default "src/camply tests hatch_build.py"}}
    deps: [sync]

  dev:
    desc: Run the Project in Debug Mode
    cmds:
      - uv run --all-extras -- gunicorn --config python:camply.server.gunicorn camply.server.app:app
    env:
      GUNICORN_RELOAD: "1"
    deps: [sync, migration-upgrade]

  build:
    desc: Build the Project Artifacts
    cmds:
      - task: docker

  docker:
    desc: Build Docker Image
    cmd: docker buildx bake --file docker-compose.yaml backend
    env:
      BACKEND_VERSION:
        sh: uv version --short

  version:
    desc: View / Set Project Version
    cmd: uv version {{.CLI_ARGS}}
    silent: true
    env:
      UV_LOCKED: 0

  admin:provision:
    desc: Provision an administrator by User UUID
    cmds:
      - uv run --all-extras -- python -m camply.server.provision {{.CLI_ARGS}}
    deps: [sync]
    preconditions:
      - sh: '[[ -z "{{.CLI_ARGS}}" ]] && exit 1 || exit 0'
        msg: User UUID is required

  ########################
  # ALEMBIC
  ########################
  migration:
    desc: Run Alembic Migration (task migration -- revision message)
    cmds:
      - uv run --all-extras -- alembic revision --autogenerate -m "{{.CLI_ARGS}}"
    deps: [sync]
    preconditions:
      - sh: '[[ -z "{{.CLI_ARGS}}" ]] && exit 1 || exit 0'
        msg: Migration message is required
  migration-upgrade:
    desc: Run Alembic Migration Upgrade
    cmds:
      - uv run --all-extras -- alembic upgrade head {{.CLI_ARGS}}
    deps: [sync]

  migration:test:
    desc: Verify PostgreSQL upgrades in a disposable Docker container
    cmds:
      - CAMPLY_POSTGRES_SMOKE=1 task backend:test -- tests/db/test_postgres_migrations.py

  ########################
  # WORKER
  ########################
  worker:dev:
    desc: Run Celery Worker in Development Mode
    deps: [sync]
    cmds:
      - uv run --all-extras -- celery -A camply.worker.celery_app worker -l info -Q celery --concurrency=2

  worker:beat:
    desc: Run Celery Beat Scheduler in Development Mode
    deps: [sync]
    cmds:
      - uv run --all-extras -- celery -A camply.worker.celery_app beat -l info

  worker:all:
    desc: Run Both Celery Worker and Beat in Development Mode
    deps: [sync]
    cmds:
      - uv run --all-extras -- celery -A camply.worker.celery_app worker -l info -Q celery --concurrency=2 -B

  maps:test-postgres:
    desc: Verify map queries against an isolated PostgreSQL container
    cmds:
      - CAMPLY_MAPS_POSTGRES=1 task backend:test -- -c pyproject.toml tests/db/integration/test_search_maps_postgres.py -s

  ########################
  # INTERNAL TASKS
  ########################
  sync:
    desc: Install Project Dependencies
    internal: true
    cmds:
      - uv sync --locked --all-extras
