[project]
name = "camply-web"
version = "0.1.0"
description = "A full-stack application to help you find campsites at sold-out campgrounds"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "aiosqlite==0.22.1",
  "alembic==1.20.1",
  "click==8.5.0",
  "fake-useragent==2.2.0",
  "httpx2==2.16.0",
  "jiter==0.18.0",
  "platformdirs==4.13.6",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "rich==15.0.0",
  "sqlalchemy[asyncio]==2.1.6",
  "structlog==26.1.0"
]

[project.scripts]
camply = "camply.cli.main:cli"

[project.optional-dependencies]
server = [
  "cryptography==50.0.2",
  "fastapi==0.162.0",
  "gunicorn==26.2.0 ; sys_platform != 'win32'",
  "orjson==3.13.0",
  "prometheus-client==0.26.0",
  "pyjwt==2.15.1",
  "uvicorn-worker==0.4.0 ; sys_platform != 'win32'",
  "uvicorn==0.54.0"
]
distributed = [
  "celery[redis]==5.6.3",
  "msgpack==1.2.4",
  "prometheus-client==0.26.0",
  "redis==6.4.0"
]
postgres = [
  "psycopg[binary]==3.3.6"
]
sentry = [
  "sentry-sdk==2.73.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camply"]
exclude = ["/src/camply/server/static"]

[tool.hatch.build.hooks.custom]
path = "src/hatchling/plugin.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src/camply",
  "/src/frontend",
  "/src/hatchling",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/.python-version"
]
exclude = ["/src/frontend/node_modules", "/src/camply/server/static", "**/__pycache__", "**/*.tsbuildinfo", "**/.env*", "**/.dev.vars*", "/src/frontend/.wrangler"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = [
  "E501",  # line too long
  "PLR0913",  # Too many arguments to function call
  "PLR0917",  # Too many positional arguments
  "PLW2901",  # Outer for loop variable overwritten by inner assignment target
  "RUF012"  # Mutable class attributes should be annotated with `typing.ClassVar`
]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "C",  # flake8-comprehensions
  "Q",  # flake8-quotes
  "B",  # flake8-bugbear
  "PLE",  # pylint
  "PLR",  # pylint
  "PLW",  # pylint
  "RUF",  # ruff
  "C90"  # mccabe
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["camply"]

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"**/tests/**/*" = ["PLR2004", "RUF059", "S101", "TID252"]
# FastAPI routers use Query/Depends in argument defaults
"**/routers/*" = ["B008"]
# Scanner task orchestrates many steps (lock, DB, provider, diff, fan-out)
"**/worker/engine/scanner.py" = ["C901", "PLR0912", "PLR0915"]
"**/worker/engine/notifications.py" = ["PLR0911"]
"**/worker/tasks/scanner.py" = ["C901", "PLR0911", "PLR0912", "PLR0915"]
# Trends service orchestrates Prometheus queries across 4 groups
"**/services/trends.py" = ["C901", "PLR0912", "PLR0915"]
# Notification dispatch and telemetry normalization have multiple exit states
"**/worker/tasks/notifications.py" = ["C901", "PLR0911"]
"**/worker/telemetry.py" = ["PLR0911", "PLW0603"]
"**/services/operations.py" = ["PLW0603", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
  "orjson",
  "uvicorn_worker",
  "celery.*",
  "aiosqlite",
  "fake_useragent",
  "hatchling.*"
]
ignore_missing_imports = true

[dependency-groups]
dev = [
  "build==1.6.1",
  "hatchling==1.33.0",
  "httpx2==2.16.0",
  "import-linter==2.15",
  "mypy==2.4.0",
  "pip==26.2.2",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1",
  "pytest-cov==7.1.0",
  "pytest-vcr==1.0.2 ; python_version < '3.15'",
  "ruff==0.17.3",
  "types-pyyaml==6.0.12.20260906",
  "types-ujson==5.10.0.20250822"
]

[tool.uv]
no-build = true
environments = [
  "python_version == '3.11' and sys_platform == 'linux' and platform_python_implementation == 'CPython'",
  "python_version == '3.12' and sys_platform == 'linux' and platform_python_implementation == 'CPython'",
  "python_version == '3.13' and sys_platform == 'linux' and platform_python_implementation == 'CPython'",
  "python_version == '3.14' and sys_platform == 'linux' and platform_python_implementation == 'CPython'",
  "python_version == '3.15' and sys_platform == 'linux' and platform_python_implementation == 'CPython'",
  "python_version == '3.11' and sys_platform == 'darwin' and platform_python_implementation == 'CPython'",
  "python_version == '3.12' and sys_platform == 'darwin' and platform_python_implementation == 'CPython'",
  "python_version == '3.13' and sys_platform == 'darwin' and platform_python_implementation == 'CPython'",
  "python_version == '3.14' and sys_platform == 'darwin' and platform_python_implementation == 'CPython'",
  "python_version == '3.15' and sys_platform == 'darwin' and platform_python_implementation == 'CPython'",
  "python_version == '3.11' and sys_platform == 'win32' and platform_python_implementation == 'CPython'",
  "python_version == '3.12' and sys_platform == 'win32' and platform_python_implementation == 'CPython'",
  "python_version == '3.13' and sys_platform == 'win32' and platform_python_implementation == 'CPython'",
  "python_version == '3.14' and sys_platform == 'win32' and platform_python_implementation == 'CPython'",
  "python_version == '3.15' and sys_platform == 'win32' and platform_python_implementation == 'CPython'"
]
required-environments = [
  "python_version == '3.11' and sys_platform == 'linux' and platform_python_implementation == 'CPython'",
  "python_version == '3.12' and sys_platform == 'linux' and platform_python_implementation == 'CPython'",
  "python_version == '3.13' and sys_platform == 'linux' and platform_python_implementation == 'CPython'",
  "python_version == '3.14' and sys_platform == 'linux' and platform_python_implementation == 'CPython'",
  "python_version == '3.15' and sys_platform == 'linux' and platform_python_implementation == 'CPython'",
  "python_version == '3.11' and sys_platform == 'darwin' and platform_python_implementation == 'CPython'",
  "python_version == '3.12' and sys_platform == 'darwin' and platform_python_implementation == 'CPython'",
  "python_version == '3.13' and sys_platform == 'darwin' and platform_python_implementation == 'CPython'",
  "python_version == '3.14' and sys_platform == 'darwin' and platform_python_implementation == 'CPython'",
  "python_version == '3.15' and sys_platform == 'darwin' and platform_python_implementation == 'CPython'",
  "python_version == '3.11' and sys_platform == 'win32' and platform_python_implementation == 'CPython'",
  "python_version == '3.12' and sys_platform == 'win32' and platform_python_implementation == 'CPython'",
  "python_version == '3.13' and sys_platform == 'win32' and platform_python_implementation == 'CPython'",
  "python_version == '3.14' and sys_platform == 'win32' and platform_python_implementation == 'CPython'",
  "python_version == '3.15' and sys_platform == 'win32' and platform_python_implementation == 'CPython'"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_default_fixture_loop_scope = "function"

[tool.importlinter]
root_package = "camply"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Component dependency layers"
type = "layers"
containers = ["camply"]
layers = ["cli | server | worker", "providers", "db", "__about__"]
exhaustive = true
ignore_imports = [
  "camply.server.app -> camply.worker.runtime",
  "camply.server.services.local_operations -> camply.worker.runtime"
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "Base dependencies stay optional-free"
type = "forbidden"
source_modules = [
  "camply",
  "camply.__about__",
  "camply.cli",
  "camply.cli.**",
  "camply.db",
  "camply.db.**",
  "camply.providers",
  "camply.providers.**"
]
as_packages = false
forbidden_modules = [
  "fastapi",
  "uvicorn",
  "gunicorn",
  "uvicorn_worker",
  "orjson",
  "jwt",
  "cryptography",
  "prometheus_client",
  "celery",
  "redis",
  "psycopg",
  "sentry_sdk"
]

[[tool.importlinter.contracts]]
name = "Workers avoid server dependencies"
type = "forbidden"
source_modules = ["camply.worker"]
forbidden_modules = [
  "fastapi",
  "uvicorn",
  "gunicorn",
  "uvicorn_worker",
  "orjson",
  "jwt",
  "cryptography"
]

[[tool.importlinter.contracts]]
name = "Server broker access uses its guarded gateway"
type = "forbidden"
source_modules = ["camply.server"]
forbidden_modules = ["celery", "redis"]
ignore_imports = [
  "camply.server.services.operations -> celery",
  "camply.server.services.operations -> redis"
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "Sentry access uses runtime initialization"
type = "forbidden"
source_modules = ["camply"]
forbidden_modules = ["sentry_sdk"]
ignore_imports = [
  "camply.server.app -> sentry_sdk",
  "camply.worker.celery_app -> sentry_sdk"
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "Package root stays lightweight"
type = "forbidden"
source_modules = ["camply"]
as_packages = false
forbidden_modules = [
  "camply.cli",
  "camply.cli.**",
  "camply.db",
  "camply.db.**",
  "camply.providers",
  "camply.providers.**",
  "camply.server",
  "camply.server.**",
  "camply.worker",
  "camply.worker.**"
]
