[project]
name = "camply"
version = "0.1.0"
description = "A full-stack application to help you find campsites at sold-out campgrounds"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.21.0,<0.23.0",
  "alembic>=1,<2",
  "click>=8,<9",
  "fake-useragent>=2.2.0",
  "httpx>=0.28.0,<0.29.0",
  "platformdirs>=4,<5",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "rich>=14,<16",
  "sqlalchemy[asyncio]>=2,<3",
  "structlog>=24,<27"
]

[project.scripts]
camply = "camply.cli.main:cli"
populate-database = "camply.providers.cli:populate_database"

[project.optional-dependencies]
server = [
  "cryptography>=42,<51",
  "fastapi>=0.115.12",
  "gunicorn>=23.0.0 ; sys_platform != 'win32'",
  "orjson>=3,<4",
  "prometheus-client>=0.21,<1",
  "pyjwt>=2,<3",
  "uvicorn-worker>=0.3.0 ; sys_platform != 'win32'",
  "uvicorn[standard]>=0.34.0"
]
distributed = [
  "celery[redis]>=5.4,<6",
  "prometheus-client>=0.21,<1",
  "redis>=5,<9"
]
postgres = [
  "psycopg[binary]>=3,<4"
]
sentry = [
  "sentry-sdk>=2,<3"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camply"]
exclude = ["/src/camply/server/static"]

[tool.hatch.build.hooks.custom]
path = "src/hatchling/plugin.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src/camply",
  "/src/frontend",
  "/src/hatchling",
  "/README.md",
  "/LICENSE",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/.python-version",
  "/vite.config.ts",
  "/tsconfig*.json"
]
exclude = ["/src/frontend/node_modules", "/src/camply/server/static", "**/__pycache__", "**/*.tsbuildinfo", "**/.env*", "**/.dev.vars*", "/src/frontend/.wrangler"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = [
  "E501",  # line too long
  "PLR0913",  # Too many arguments to function call
  "PLR0917",  # Too many positional arguments
  "PLW2901",  # Outer for loop variable overwritten by inner assignment target
  "RUF012"  # Mutable class attributes should be annotated with `typing.ClassVar`
]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "C",  # flake8-comprehensions
  "Q",  # flake8-quotes
  "B",  # flake8-bugbear
  "PLE",  # pylint
  "PLR",  # pylint
  "PLW",  # pylint
  "RUF",  # ruff
  "C90"  # mccabe
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["camply"]

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"**/tests/**/*" = ["PLR2004", "RUF059", "S101", "TID252"]
# FastAPI routers use Query/Depends in argument defaults
"**/routers/*" = ["B008"]
# Scanner task orchestrates many steps (lock, DB, provider, diff, fan-out)
"**/worker/engine/scanner.py" = ["C901", "PLR0912", "PLR0915"]
"**/worker/engine/notifications.py" = ["PLR0911"]
"**/worker/tasks/scanner.py" = ["C901", "PLR0911", "PLR0912", "PLR0915"]
# Trends service orchestrates Prometheus queries across 4 groups
"**/services/trends.py" = ["C901", "PLR0912", "PLR0915"]
# Notification dispatch and telemetry normalization have multiple exit states
"**/worker/tasks/notifications.py" = ["C901", "PLR0911"]
"**/worker/telemetry.py" = ["PLR0911", "PLW0603"]
"**/services/operations.py" = ["PLW0603", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
  "orjson",
  "uvicorn_worker",
  "celery.*",
  "aiosqlite",
  "fake_useragent",
  "hatchling.*"
]
ignore_missing_imports = true

[dependency-groups]
dev = [
  "build>=1.6.1",
  "hatchling>=1.33.0",
  "httpx>=0.28.1",
  "import-linter>=2.15,<3",
  "mypy>=1,<3",
  "pip>=24,<27",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "pytest-vcr>=1.0.2",
  "ruff>=0.11.0,<0.18.0",
  "types-pyyaml>=6.0.12.20250516",
  "types-ujson>=5.10.0.20250326"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_default_fixture_loop_scope = "function"

[tool.importlinter]
root_package = "camply"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Component dependency layers"
type = "layers"
containers = ["camply"]
layers = ["cli | server | worker", "providers", "db", "__about__"]
exhaustive = true
ignore_imports = [
  "camply.server.app -> camply.worker.runtime",
  "camply.server.services.local_operations -> camply.worker.runtime"
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "Base dependencies stay optional-free"
type = "forbidden"
source_modules = [
  "camply",
  "camply.__about__",
  "camply.cli",
  "camply.cli.**",
  "camply.db",
  "camply.db.**",
  "camply.providers",
  "camply.providers.**"
]
as_packages = false
forbidden_modules = [
  "fastapi",
  "uvicorn",
  "gunicorn",
  "uvicorn_worker",
  "orjson",
  "jwt",
  "cryptography",
  "prometheus_client",
  "celery",
  "redis",
  "psycopg",
  "sentry_sdk"
]

[[tool.importlinter.contracts]]
name = "Workers avoid server dependencies"
type = "forbidden"
source_modules = ["camply.worker"]
forbidden_modules = [
  "fastapi",
  "uvicorn",
  "gunicorn",
  "uvicorn_worker",
  "orjson",
  "jwt",
  "cryptography"
]

[[tool.importlinter.contracts]]
name = "Server broker access uses its guarded gateway"
type = "forbidden"
source_modules = ["camply.server"]
forbidden_modules = ["celery", "redis"]
ignore_imports = [
  "camply.server.services.operations -> celery",
  "camply.server.services.operations -> redis"
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "Sentry access uses runtime initialization"
type = "forbidden"
source_modules = ["camply"]
forbidden_modules = ["sentry_sdk"]
ignore_imports = [
  "camply.server.app -> sentry_sdk",
  "camply.worker.celery_app -> sentry_sdk"
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "Package root stays lightweight"
type = "forbidden"
source_modules = ["camply"]
as_packages = false
forbidden_modules = [
  "camply.cli",
  "camply.cli.**",
  "camply.db",
  "camply.db.**",
  "camply.providers",
  "camply.providers.**",
  "camply.server",
  "camply.server.**",
  "camply.worker",
  "camply.worker.**"
]
