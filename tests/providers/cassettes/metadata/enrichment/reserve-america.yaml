          />\nHandicap site #35 is only reservable through the call center.  This site
          requires a handicap sticker, plate or placard. Reservations: [redacted].\n<hr
          />\n\nJackson Lake is well known for its wonderful campgrounds and excellent
          water sports on a wide-open high-plains reservoir. There''s plenty of room
          for everyone on this large body of water - sailboats, motorboats, personal
          watercraft - as well as the beautiful waterfowl and wildlife that call this
          area home. \n<hr />\nJackson Lake has 260 campsites, most of which accommodate
          campers, trailers or tents. Shade may be naturally provided by trees and other
          vegetation or by man-made shelter. Please call the Park for specific details.
          Jackson Lake State Park also offers a group picnic area (complete with picnic
          pavilion) and a group campground. Call the park for details at [redacted].\n\nFor
          current conditions and more information, please visit the Jackson Lake website:
          http://cpw.state.co.us/placestogo/parks/jacksonlake"},{"content":"<b>NO-SHOW
          Policy</b><br />\nIf you do not arrive to the park within 24 hours of your
          scheduled check in time and do not notify the park that you will be arriving
          late, your site may be resold and may not be available when you arrive. The
          fees for any nights passed are non-refundable.<br /><br />\n\n<b>Changes and
          Cancellations</b>\n<ul>\n<li>Cancellations or changes may be made online 24
          hours a day 7 days a week, or through the Aspira Call Center at [redacted].</li>\n<li>Reservations
          where one or more dates fall outside of the 6-month booking window are frozen
          for 14 days.</li>\n<li>Cancellations:\n\n<ul>\n<li>If the cancellation is
          made 28 days or more prior to the arrival date, 25% of the fee for 1 night
          or day-use permit will be retained</li>\n<li>If the cancellation is made 8-27
          days prior to the arrival date, 50% of the fee for 1 night or day-use permit
