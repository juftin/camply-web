          to the arrival date, 100% of the fee for 1 night or day-use permit will be
          retained.</li>\n<li>If a reservation is cancelled at any time after the arrival
          date, any nights prior to the cancellation are NON-REFUNDABLE </li>\n\n</ul></li>\n<li>Changes:\n<ul>\n<li>If
